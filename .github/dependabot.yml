version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - "type: ci"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    labels:
      - "area: backend"
    groups:
      go:
        patterns:
          - "*"
