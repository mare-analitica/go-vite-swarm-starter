# Stack "platform": shared services every system uses.
#
#   traefik        HTTPS for every domain (Let's Encrypt HTTP-01), HTTP -> HTTPS
#   socket-proxy   read-only Docker API for Traefik (no socket in Traefik)
#   registry       private image registry on 127.0.0.1:5000 (never exposed)
#   postgres       PostgreSQL 17: one role and database per system (hooks)
#   minio          S3-compatible object storage: one bucket and user per system
#
#   deploy stack platform
#
# Configuration: /etc/starter/config.env (see deploy/config/example.env).
# Secrets: deploy/hooks/platform.sh generates them on the host.
#
# Every image is pinned by digest: a redeploy never changes a version; an
# upgrade is a reviewed commit. Services with data or host ports use
# stop-first (two instances on one data directory corrupt it).

x-stop-first: &stop-first
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    order: stop-first

services:
  traefik:
    image: traefik:v3.7@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=tcp://socket-proxy:2375
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=edge
      # New routes are picked up within 5s of a deploy (default 15s).
      - --providers.swarm.refreshSeconds=5
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Every router on :443 gets a certificate and the security headers.
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.middlewares=secure-headers@swarm
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --ping=true
      - --accesslog=true
      - --accesslog.format=json
      - --log.level=INFO
    ports:
      # mode: host keeps the client IP (the ingress mesh would NAT it and
      # break the admin allowlist).
      - { target: 80, published: 80, mode: host }
      - { target: 443, published: 443, mode: host }
    volumes:
      - traefik_certificates:/letsencrypt
    networks: [edge, socket]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      placement:
        constraints: [node.role == manager]
      <<: *stop-first
      labels:
        # Traefik only reads labels of enabled services, and an enabled service
        # needs a router and a port. This host-less router on :80 never asks
        # for a certificate (the default rule would request one for an invalid
        # name) and never matches in practice: :80 redirects to HTTPS first.
        - traefik.enable=true
        - traefik.http.routers.shared-middlewares.rule=PathPrefix(`/.shared-middlewares`)
        - traefik.http.routers.shared-middlewares.entrypoints=web
        - traefik.http.routers.shared-middlewares.service=shared-middlewares
        - traefik.http.services.shared-middlewares.loadbalancer.server.port=9
        - traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000
        - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
        - traefik.http.middlewares.secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
        - traefik.http.middlewares.secure-headers.headers.frameDeny=true
        # Admin consoles (MinIO console, n8n editor, Jenkins) only from these CIDRs.
        - traefik.http.middlewares.admin-allowlist.ipallowlist.sourcerange=${ADMIN_CIDRS}
      resources:
        limits: { memory: 128M }

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      # Only what the Traefik Swarm provider reads. POST=0: no writes at all.
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      NODES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    deploy:
      placement:
        constraints: [node.role == manager]
      update_config: { order: start-first, failure_action: rollback }
      resources:
        limits: { memory: 64M }

  registry:
    image: registry:3@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: registry
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/registry_htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # Health on a separate unauthenticated port, reachable only inside the container.
      REGISTRY_HTTP_DEBUG_ADDR: 127.0.0.1:5001
    secrets: [registry_htpasswd]
    ports:
      # The host daemon pushes and pulls on 127.0.0.1:5000 (loopback needs no
      # TLS). The DOCKER-USER firewall rule drops outside access to this port.
      - { target: 5000, published: 5000, mode: host }
    volumes:
      - registry_data:/var/lib/registry
    networks:
      # "default" keeps the bridge to the host so the host port is published.
      default: {}
      # BuildKit pushes over the ci network. Alias "registry": the service name
      # contains "_", which is not valid as a host in an image reference.
      ci:
        aliases: [registry]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5001/debug/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      <<: *stop-first
      resources:
        limits: { memory: 128M }

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first boot (initdb) on a small VPS can take a while.
      start_period: 60s
    deploy:
      <<: *stop-first
      resources:
        limits: { memory: 512M }

  minio:
    # WARNING: the MinIO community edition no longer receives updates or
    # security fixes, and its public images were removed from Docker Hub.
    # This digest is the last community build; it is fine for a starter and
    # internal use, but read docs/object-storage.md before storing anything
    # important and consider an S3 provider or another S3-compatible server.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772@sha256:cf3dadcfa1fb0324f43958bad1abba986d53c4ecc04d4d50b46c7dcda28bd3cd
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio-root
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_DOMAIN}
      # Browsers upload with presigned POST from the application origin.
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_DOMAIN}
    secrets: [minio_root_password]
    volumes:
      - minio_data:/data
    networks:
      edge: {}
      data:
        # S3 clients send the host in a signed header; MinIO rejects
        # "platform_minio" ("_" is not valid in a hostname) with 400.
        aliases: [minio]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      <<: *stop-first
      labels:
        - traefik.enable=true
        # S3 API: public, every request is signed (presigned URLs expire).
        - traefik.http.routers.s3.rule=Host(`${S3_DOMAIN}`)
        - traefik.http.routers.s3.entrypoints=websecure
        - traefik.http.routers.s3.service=s3
        - traefik.http.services.s3.loadbalancer.server.port=9000
        # Console: administrators only.
        - traefik.http.routers.minio-console.rule=Host(`${MINIO_CONSOLE_DOMAIN}`)
        - traefik.http.routers.minio-console.entrypoints=websecure
        - traefik.http.routers.minio-console.middlewares=admin-allowlist@swarm
        - traefik.http.routers.minio-console.service=minio-console
        - traefik.http.services.minio-console.loadbalancer.server.port=9001
      resources:
        limits: { memory: 512M }

secrets:
  registry_htpasswd:
    external: true
    name: ${REGISTRY_HTPASSWD_SECRET}
  postgres_password:
    external: true
    name: ${POSTGRES_PASSWORD_SECRET}
  minio_root_password:
    external: true
    name: ${MINIO_ROOT_PASSWORD_SECRET}

networks:
  # Created by deploy/host/bootstrap.sh and shared with other stacks.
  edge: { external: true }
  data: { external: true }
  ci: { external: true }
  # Traefik <-> socket proxy only.
  socket:
    driver: overlay
    internal: true

volumes:
  traefik_certificates:
  registry_data:
  postgres_data:
  minio_data:
